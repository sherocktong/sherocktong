<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ site.title | default: site.github.repository_name }}</title>
{% seo %}
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
/* ===== RESET & BASE ===== */
*, *::before, *::after {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

:root {
  --bg-primary: #0d0221;
  --bg-secondary: #11052c;
  --bg-tertiary: #1a0b3d;
  --neon-cyan: #00f3ff;
  --neon-magenta: #ff00ff;
  --neon-yellow: #faff00;
  --neon-purple: #bc13fe;
  --neon-green: #0aff00;
  --text-primary: #e0e0e0;
  --text-dim: #888;
  --pixel-size: 4px;
}

html {
  scroll-behavior: smooth;
}

body {
  background-color: var(--bg-primary);
  color: var(--text-primary);
  font-family: 'VT323', monospace;
  font-size: 20px;
  line-height: 1.6;
  overflow-x: hidden;
  position: relative;
}

/* ===== CRT SCANLINE OVERLAY ===== */
body::before {
  content: '';
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  background: repeating-linear-gradient(
    0deg,
    rgba(0, 0, 0, 0.15) 0px,
    rgba(0, 0, 0, 0.15) 1px,
    transparent 1px,
    transparent 2px
  );
  pointer-events: none;
  z-index: 9999;
  animation: scanline-flicker 0.15s infinite;
}

@keyframes scanline-flicker {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.98; }
}

/* ===== CRT FLICKER OVERLAY ===== */
body::after {
  content: '';
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  background: radial-gradient(
    ellipse at center,
    transparent 0%,
    rgba(0, 0, 0, 0.4) 100%
  );
  pointer-events: none;
  z-index: 9998;
}

/* ===== UTILITY CLASSES ===== */
.neon-cyan { color: var(--neon-cyan); text-shadow: 0 0 5px var(--neon-cyan), 0 0 10px var(--neon-cyan), 0 0 20px var(--neon-cyan); }
.neon-magenta { color: var(--neon-magenta); text-shadow: 0 0 5px var(--neon-magenta), 0 0 10px var(--neon-magenta), 0 0 20px var(--neon-magenta); }
.neon-yellow { color: var(--neon-yellow); text-shadow: 0 0 5px var(--neon-yellow), 0 0 10px var(--neon-yellow), 0 0 20px var(--neon-yellow); }
.neon-purple { color: var(--neon-purple); text-shadow: 0 0 5px var(--neon-purple), 0 0 10px var(--neon-purple), 0 0 20px var(--neon-purple); }
.neon-green { color: var(--neon-green); text-shadow: 0 0 5px var(--neon-green), 0 0 10px var(--neon-green), 0 0 20px var(--neon-green); }

.glow-cyan { box-shadow: 0 0 5px var(--neon-cyan), 0 0 10px var(--neon-cyan), inset 0 0 5px rgba(0, 243, 255, 0.1); }
.glow-magenta { box-shadow: 0 0 5px var(--neon-magenta), 0 0 10px var(--neon-magenta), inset 0 0 5px rgba(255, 0, 255, 0.1); }
.glow-yellow { box-shadow: 0 0 5px var(--neon-yellow), 0 0 10px var(--neon-yellow), inset 0 0 5px rgba(250, 255, 0, 0.1); }

.pixel-border {
  border: var(--pixel-size) solid var(--neon-cyan);
  box-shadow:
    0 0 0 2px var(--bg-primary),
    0 0 0 4px var(--neon-cyan),
    0 0 10px var(--neon-cyan);
}

.pixel-border-magenta {
  border: var(--pixel-size) solid var(--neon-magenta);
  box-shadow:
    0 0 0 2px var(--bg-primary),
    0 0 0 4px var(--neon-magenta),
    0 0 10px var(--neon-magenta);
}

/* ===== GLITCH ANIMATION ===== */
.glitch {
  position: relative;
  font-family: 'Press Start 2P', cursive;
}

.glitch::before,
.glitch::after {
  content: attr(data-text);
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
}

.glitch::before {
  color: var(--neon-magenta);
  animation: glitch-1 2s infinite linear alternate-reverse;
  clip-path: polygon(0 0, 100% 0, 100% 35%, 0 35%);
}

.glitch::after {
  color: var(--neon-cyan);
  animation: glitch-2 3s infinite linear alternate-reverse;
  clip-path: polygon(0 65%, 100% 65%, 100% 100%, 0 100%);
}

@keyframes glitch-1 {
  0%, 90%, 100% { transform: translate(0); }
  92% { transform: translate(-3px, 1px); }
  94% { transform: translate(3px, -1px); }
  96% { transform: translate(-2px, 2px); }
  98% { transform: translate(2px, -2px); }
}

@keyframes glitch-2 {
  0%, 90%, 100% { transform: translate(0); }
  91% { transform: translate(3px, -1px); }
  93% { transform: translate(-3px, 1px); }
  95% { transform: translate(2px, 2px); }
  97% { transform: translate(-2px, -2px); }
}

/* ===== BLINKING CURSOR ===== */
.cursor {
  display: inline-block;
  width: 12px;
  height: 1.2em;
  background-color: var(--neon-cyan);
  animation: blink 1s step-end infinite;
  vertical-align: text-bottom;
  margin-left: 4px;
}

@keyframes blink {
  0%, 100% { opacity: 1; }
  50% { opacity: 0; }
}

/* ===== TERMINAL WINDOW ===== */
.terminal-window {
  background-color: var(--bg-secondary);
  border: 2px solid var(--neon-cyan);
  border-radius: 0;
  position: relative;
  overflow: hidden;
}

.terminal-window::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 32px;
  background: linear-gradient(90deg, var(--neon-cyan), var(--neon-purple));
  opacity: 0.3;
}

.terminal-header {
  display: flex;
  align-items: center;
  padding: 6px 12px;
  background: linear-gradient(90deg, rgba(0, 243, 255, 0.2), rgba(188, 19, 254, 0.2));
  border-bottom: 2px solid var(--neon-cyan);
  position: relative;
  z-index: 1;
}

.terminal-dot {
  width: 12px;
  height: 12px;
  border-radius: 0;
  margin-right: 8px;
  border: 2px solid;
}

.terminal-dot.red { background-color: #ff4444; border-color: #ff6666; }
.terminal-dot.yellow { background-color: #ffaa00; border-color: #ffcc44; }
.terminal-dot.green { background-color: #00ff44; border-color: #44ff66; }

.terminal-title {
  font-family: 'Press Start 2P', cursive;
  font-size: 10px;
  color: var(--neon-cyan);
  margin-left: auto;
  letter-spacing: 1px;
}

.terminal-body {
  padding: 24px;
  position: relative;
  z-index: 1;
}

.terminal-body p {
  margin-bottom: 12px;
}

.terminal-body p::before {
  content: '> ';
  color: var(--neon-green);
}

/* ===== SECTIONS ===== */
section {
  padding: 80px 20px;
  max-width: 1200px;
  margin: 0 auto;
  position: relative;
  z-index: 1;
}

.section-title {
  font-family: 'Press Start 2P', cursive;
  font-size: 24px;
  margin-bottom: 40px;
  text-align: center;
  color: var(--neon-cyan);
  text-shadow: 0 0 5px var(--neon-cyan), 0 0 10px var(--neon-cyan);
  position: relative;
  display: inline-block;
  left: 50%;
  transform: translateX(-50%);
}

.section-title::after {
  content: '';
  display: block;
  width: 100%;
  height: 4px;
  background: linear-gradient(90deg, transparent, var(--neon-cyan), transparent);
  margin-top: 12px;
}

/* ===== HERO SECTION ===== */
#hero {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  position: relative;
}

#hero::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background:
    radial-gradient(circle at 20% 50%, rgba(0, 243, 255, 0.05) 0%, transparent 50%),
    radial-gradient(circle at 80% 50%, rgba(255, 0, 255, 0.05) 0%, transparent 50%);
  pointer-events: none;
}

.hero-name {
  font-family: 'Press Start 2P', cursive;
  font-size: clamp(24px, 6vw, 56px);
  color: var(--text-primary);
  margin-bottom: 20px;
  letter-spacing: 4px;
  line-height: 1.4;
}

.hero-tagline {
  font-family: 'VT323', monospace;
  font-size: clamp(20px, 3vw, 32px);
  color: var(--neon-yellow);
  text-shadow: 0 0 5px var(--neon-yellow);
  margin-bottom: 30px;
}

.hero-sub {
  font-size: 22px;
  color: var(--text-dim);
  max-width: 600px;
}

/* ===== SKILLS GRID ===== */
.skills-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 24px;
}

.skill-card {
  background-color: var(--bg-secondary);
  border: 3px solid var(--neon-cyan);
  padding: 24px 16px;
  text-align: center;
  transition: all 0.3s ease;
  cursor: default;
  position: relative;
}

.skill-card::before {
  content: '';
  position: absolute;
  top: -3px;
  left: -3px;
  right: -3px;
  bottom: -3px;
  background: transparent;
  border: 3px solid transparent;
  transition: all 0.3s ease;
  pointer-events: none;
}

.skill-card:hover {
  transform: translateY(-4px);
  box-shadow: 0 0 15px var(--neon-cyan), inset 0 0 10px rgba(0, 243, 255, 0.1);
}

.skill-card:hover::before {
  border-color: var(--neon-magenta);
}

.skill-icon {
  font-size: 40px;
  margin-bottom: 12px;
  display: block;
}

.skill-name {
  font-family: 'Press Start 2P', cursive;
  font-size: 10px;
  color: var(--neon-cyan);
  letter-spacing: 1px;
}

.skill-details {
  font-family: 'VT323', monospace;
  font-size: 16px;
  color: var(--text-dim);
  margin-top: 8px;
  line-height: 1.4;
}

/* ===== PROJECTS GRID ===== */
.projects-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
  gap: 32px;
}

.project-card {
  background-color: var(--bg-secondary);
  border: 3px solid var(--neon-magenta);
  padding: 0;
  transition: all 0.3s ease;
  position: relative;
  overflow: hidden;
}

.project-card::before {
  content: '';
  position: absolute;
  top: 0;
  left: -100%;
  width: 100%;
  height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255, 0, 255, 0.1), transparent);
  transition: left 0.5s ease;
}

.project-card:hover::before {
  left: 100%;
}

.project-card:hover {
  box-shadow: 0 0 20px var(--neon-magenta), inset 0 0 15px rgba(255, 0, 255, 0.1);
  transform: translateY(-4px);
}

.project-header {
  padding: 16px 20px;
  background: linear-gradient(90deg, rgba(255, 0, 255, 0.15), transparent);
  border-bottom: 2px solid var(--neon-magenta);
}

.project-title {
  font-family: 'Press Start 2P', cursive;
  font-size: 12px;
  color: var(--neon-magenta);
  margin: 0;
}

.project-body {
  padding: 20px;
}

.project-desc {
  color: var(--text-dim);
  font-size: 20px;
  line-height: 1.5;
}

.project-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 16px;
}

.project-tag {
  font-family: 'Press Start 2P', cursive;
  font-size: 8px;
  padding: 4px 8px;
  border: 2px solid var(--neon-cyan);
  color: var(--neon-cyan);
  background-color: rgba(0, 243, 255, 0.1);
}

/* ===== EXPERIENCE LIST ===== */
.experience-list {
  display: flex;
  flex-direction: column;
  gap: 24px;
}

.experience-item {
  background-color: var(--bg-secondary);
  border: 2px solid var(--neon-purple);
  padding: 20px;
  position: relative;
  transition: all 0.3s ease;
}

.experience-item:hover {
  box-shadow: 0 0 15px var(--neon-purple), inset 0 0 10px rgba(188, 19, 254, 0.1);
  transform: translateX(4px);
}

.experience-header {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 8px;
}

.experience-company {
  font-family: 'Press Start 2P', cursive;
  font-size: 12px;
  color: var(--neon-purple);
}

.experience-period {
  font-family: 'VT323', monospace;
  font-size: 18px;
  color: var(--neon-yellow);
}

.experience-role {
  font-size: 22px;
  color: var(--neon-cyan);
  margin-bottom: 8px;
}

.experience-desc {
  color: var(--text-dim);
  font-size: 20px;
  line-height: 1.5;
}

/* ===== CONTACT / FOOTER ===== */
#contact {
  padding-bottom: 40px;
}

.contact-terminal {
  max-width: 600px;
  margin: 0 auto;
}

.contact-links {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 16px;
  margin-top: 20px;
}

.contact-link {
  font-family: 'VT323', monospace;
  font-size: 22px;
  color: var(--neon-cyan);
  text-decoration: none;
  padding: 8px 16px;
  border: 2px solid var(--neon-cyan);
  background-color: rgba(0, 243, 255, 0.05);
  transition: all 0.3s ease;
  position: relative;
}

.contact-link::before {
  content: '$ ';
  color: var(--neon-green);
}

.contact-link:hover {
  background-color: rgba(0, 243, 255, 0.2);
  box-shadow: 0 0 10px var(--neon-cyan);
  color: var(--neon-yellow);
  border-color: var(--neon-yellow);
}

.footer-copy {
  text-align: center;
  margin-top: 40px;
  color: var(--text-dim);
  font-size: 18px;
}

/* ===== RESPONSIVE ===== */
@media (max-width: 768px) {
  .skills-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .projects-grid {
    grid-template-columns: 1fr;
  }

  section {
    padding: 60px 16px;
  }

  .terminal-body {
    padding: 16px;
  }

  .experience-header {
    flex-direction: column;
    align-items: flex-start;
  }
}

@media (max-width: 480px) {
  .skills-grid {
    grid-template-columns: 1fr;
  }

  .hero-name {
    letter-spacing: 2px;
  }
}

/* ===== CANVAS BACKGROUND ===== */
#bg-canvas {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  z-index: 0;
  pointer-events: none;
}

/* ===== SECTION VISIBILITY ===== */
.section {
  opacity: 0;
  transform: translateY(30px);
  transition: opacity 0.8s ease, transform 0.8s ease;
}

.section.visible {
  opacity: 1;
  transform: translateY(0);
}

#hero.section {
  opacity: 1;
  transform: translateY(0);
}

/* ===== SCROLLBAR ===== */
::-webkit-scrollbar {
  width: 10px;
}

::-webkit-scrollbar-track {
  background: var(--bg-primary);
}

::-webkit-scrollbar-thumb {
  background: var(--neon-cyan);
  border: 2px solid var(--bg-primary);
}

::-webkit-scrollbar-thumb:hover {
  background: var(--neon-magenta);
}
</style>

{{ content }}

<script>
document.addEventListener('DOMContentLoaded', () => {
  // ===== 1. Typing Effect =====
  const heroName = document.querySelector('.hero-name');
  if (heroName) {
    const fullText = heroName.textContent.trim();
    heroName.textContent = '';
    heroName.setAttribute('data-text', fullText);
    let i = 0;
    function typeChar() {
      if (i < fullText.length) {
        heroName.textContent += fullText.charAt(i);
        i++;
        setTimeout(typeChar, 30 + Math.random() * 50);
      }
    }
    typeChar();
  }

  // ===== 2. Scroll Animations =====
  const sections = document.querySelectorAll('.section');
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.classList.add('visible');
      }
    });
  }, { threshold: 0.1 });
  sections.forEach(section => observer.observe(section));

  // ===== 3. Canvas Background (Matrix-style Digital Rain) =====
  const canvas = document.getElementById('bg-canvas');
  if (canvas) {
    const ctx = canvas.getContext('2d');
    let width, height;
    const chars = '01アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン';
    const fontSize = 14;
    let columns;
    let drops;

    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      columns = Math.floor(width / fontSize);
      drops = Array(columns).fill(1);
    }
    resize();
    window.addEventListener('resize', resize);

    const colors = ['#00f3ff', '#ff00ff', '#faff00'];

    function draw() {
      ctx.fillStyle = 'rgba(13, 2, 33, 0.08)';
      ctx.fillRect(0, 0, width, height);

      ctx.font = fontSize + 'px monospace';

      for (let c = 0; c < drops.length; c++) {
        const char = chars[Math.floor(Math.random() * chars.length)];
        const color = colors[Math.floor(Math.random() * colors.length)];
        ctx.fillStyle = color;
        ctx.globalAlpha = 0.3 + Math.random() * 0.4;
        ctx.fillText(char, c * fontSize, drops[c] * fontSize);

        if (drops[c] * fontSize > height && Math.random() > 0.975) {
          drops[c] = 0;
        }
        drops[c]++;
      }
      ctx.globalAlpha = 1;
      requestAnimationFrame(draw);
    }
    draw();
  }

  // ===== 4. Parallax Effect =====
  const heroContent = document.querySelector('.hero-name');
  const heroTagline = document.querySelector('.hero-tagline');
  const heroSub = document.querySelector('.hero-sub');
  if (heroContent) {
    document.addEventListener('mousemove', (e) => {
      const x = (e.clientX / window.innerWidth - 0.5) * 2;
      const y = (e.clientY / window.innerHeight - 0.5) * 2;
      const tx = x * -8;
      const ty = y * -8;
      heroContent.style.transform = `translate(${tx}px, ${ty}px)`;
      if (heroTagline) heroTagline.style.transform = `translate(${tx * 0.5}px, ${ty * 0.5}px)`;
      if (heroSub) heroSub.style.transform = `translate(${tx * 0.3}px, ${ty * 0.3}px)`;
    });
  }

  // ===== 5. Glitch Trigger =====
  if (heroName) {
    setInterval(() => {
      heroName.classList.remove('glitch');
      void heroName.offsetWidth;
      heroName.classList.add('glitch');
    }, 5000 + Math.random() * 5000);
  }
});
</script>
