<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
  <!-- Background -->
  <rect x="0" y="0" width="64" height="64" fill="#1a1a2e"/>

  <!-- Antenna -->
  <rect x="30" y="4" width="4" height="8" fill="#ffffff"/>
  <rect x="28" y="2" width="8" height="4" fill="#ff00ff"/>

  <!-- Head -->
  <rect x="16" y="12" width="32" height="24" fill="#4a148c" stroke="#00f3ff" stroke-width="2"/>
  <rect x="18" y="14" width="28" height="20" fill="#1a1a2e"/>

  <!-- Eyes -->
  <rect x="22" y="18" width="8" height="8" fill="#00f3ff"/>
  <rect x="34" y="18" width="8" height="8" fill="#00f3ff"/>
  <rect x="24" y="20" width="4" height="4" fill="#ffffff"/>
  <rect x="36" y="20" width="4" height="4" fill="#ffffff"/>

  <!-- Mouth -->
  <rect x="26" y="30" width="12" height="2" fill="#faff00"/>

  <!-- Body -->
  <rect x="20" y="38" width="24" height="20" fill="#4a148c" stroke="#ff00ff" stroke-width="2"/>
  <rect x="22" y="40" width="20" height="16" fill="#1a1a2e"/>

  <!-- Chest Light -->
  <rect x="28" y="44" width="8" height="8" fill="#faff00"/>
  <rect x="30" y="46" width="4" height="4" fill="#ffffff"/>

  <!-- Arms -->
  <rect x="8" y="40" width="8" height="16" fill="#4a148c" stroke="#00f3ff" stroke-width="2"/>
  <rect x="48" y="40" width="8" height="16" fill="#4a148c" stroke="#00f3ff" stroke-width="2"/>

  <!-- Hands -->
  <rect x="8" y="56" width="8" height="4" fill="#faff00"/>
  <rect x="48" y="56" width="8" height="4" fill="#faff00"/>
</svg>
